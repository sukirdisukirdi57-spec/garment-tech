
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Seri Jarum | Garment Tech</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f3f5f7;
            color: #222;
            line-height: 1.6;
        }
        main {
            max-width: 800px;
            margin: auto;
            padding: 22px;
            background: white;
            border-radius: 10px;
        }
        h1 { font-size: 25px; }
        .field { margin: 15px 0; }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
        }
        textarea { min-height: 90px; }
        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 6px;
            background: #075bb5;
            color: white;
            font-size: 16px;
        }
        .notice {
            padding: 12px;
            background: #fff0f0;
            color: #8b1515;
            border-radius: 6px;
        }
        a { color: #075bb5; }
    
/* GT NEEDLE SERIES EDIT - INDUSTRIAL MODERN V1 */
body.needle-series-edit-page {
    margin: 0;
    padding: 24px 16px;
    background: #eef2f7;
    color: #263548;
    font-family: Arial, sans-serif;
    line-height: 1.6;
}
.needle-series-edit-page main {
    width: min(100%, 780px);
    margin: 0 auto;
    padding: 0;
}
.needle-series-edit-page main > h1 {
    margin: 16px 0 20px;
    padding: 25px 26px;
    color: #fff;
    background: linear-gradient(135deg, #102d4f, #081525);
    border-left: 6px solid #f28c28;
    border-radius: 14px;
    font-size: 25px;
}
.needle-series-edit-page a {
    color: #174d7c;
    font-weight: 600;
}
.needle-series-edit-page form {
    padding: 24px;
    background: #fff;
    border: 1px solid #dce4ed;
    border-radius: 14px;
    box-shadow: 0 5px 18px rgba(16,45,79,.07);
}
.needle-series-edit-page input,
.needle-series-edit-page textarea,
.needle-series-edit-page select {
    box-sizing: border-box;
    max-width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 11px 12px;
    background: #fbfdff;
    font: inherit;
}
.needle-series-edit-page input:focus,
.needle-series-edit-page textarea:focus,
.needle-series-edit-page select:focus {
    outline: 2px solid rgba(242,140,40,.25);
    border-color: #f28c28;
}
.needle-series-edit-page button {
    padding: 11px 19px;
    border: 0;
    border-radius: 8px;
    background: #102d4f;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
}
.needle-series-edit-page button:hover {
    background: #f28c28;
    color: #102d4f;
}
.needle-series-edit-page .notice {
    padding: 12px 15px;
    border-radius: 9px;
    background: #fff2e5;
    border: 1px solid #f5c48f;
    color: #80501b;
}
@media (max-width: 600px) {
    body.needle-series-edit-page { padding: 14px 10px; }
    .needle-series-edit-page main > h1 {
        padding: 19px 16px;
        font-size: 21px;
    }
    .needle-series-edit-page form { padding: 16px; }
}
/* END GT NEEDLE SERIES EDIT */

</style>
</head>
<body class="needle-series-edit-page">
<main>
    <a href="/admin/needle-series">← Kembali ke Master Seri Jarum</a>

    <h1>Edit Seri Jarum</h1>

    {% if error %}
    <div class="notice" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post">
        <input type="hidden" name="_csrf_token"
               value="{{ csrf_token() }}">

        <div class="field">
            <label for="series_code">Kode seri *</label>
            <input id="series_code" name="series_code"
                   maxlength="50" required
                   value="{{ values.get('series_code', '') }}">
        </div>

        <div class="field">
            <label for="series_name">Nama seri *</label>
            <input id="series_name" name="series_name"
                   maxlength="120" required
                   value="{{ values.get('series_name', '') }}">
        </div>

        <div class="field">
            <label for="description">Deskripsi</label>
            <textarea id="description" name="description">{{ values.get('description', '') }}</textarea>
        </div>

        <div class="field">
            <label for="verification_notes">Catatan verifikasi</label>
            <textarea id="verification_notes" name="verification_notes">{{ values.get('verification_notes', '') }}</textarea>
        </div>

        <label for="verification_status">Status verifikasi *</label>
    <select id="verification_status" name="verification_status" required>
        {% for status in ["Perlu diverifikasi", "Terverifikasi", "Perlu koreksi"] %}
        <option value="{{ status }}"
            {% if values["verification_status"] == status %}selected{% endif %}>
            {{ status }}
        </option>
        {% endfor %}
    </select>

    <button type="submit">Simpan Perubahan</button>
    </form>
</main>
</body>
</html>
